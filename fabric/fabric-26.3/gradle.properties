# 26.3 配置（2026-09-17）
# =====================================================
# 【多版本差异】26.x 与 1.x 构建体系完全不同：
#   - mappings：mojmap 官方映射（yarn 26.x 不存在，fabric 生态弃用 yarn，实证：carpet 26.x jar 内为 mojmap 名）
#   - loom：1.17.19（26.x 未混淆专用新版插件）
#   - Java：25（carpet 26.x 要求 java >= 25）
# 本目录是独立 gradle 项目，不影响 1.16.5~1.21.11 的 14 个版本目录（它们继续用 loom 1.17.11 + yarn）
# 版本对应（Modrinth API 实证）：
#   - fabric-api 0.160.6+26.3（26.3 正式版首个 build，2026-09-16 发布）
#   - fabric-loader 官方建议 0.19.5（fabricmc.net 26.3 发布说明）
#   - carpet 官方已发布 26.3（2026-09-18，release），carpet_version=26.3 可直接拉取编译
# =====================================================
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true
org.gradle.configuration-cache=false
# 26.x 需要 JDK 25 运行 gradle（如需本地指定 JDK，请在本文件追加 org.gradle.java.home）

mod_version=1.0.0
maven_group=com.example
loom_version=1.17.19
targetJavaVersion=25
minecraft_version=26.3
loader_version=0.19.5
fabric_api_version=0.160.6+26.3
carpet_version=26.3
# MixinExtras（@WrapOperation 等）；运行期 loader 0.15+ 已内置，此版本仅用于编译期与 include 打包
mixinextras_version=0.5.4
# 注意：无 yarn_mappings（26.x 用 mojmap，见 build.gradle 的 mappings 配置）