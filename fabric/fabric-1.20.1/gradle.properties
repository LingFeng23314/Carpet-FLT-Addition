# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# =========================================================
# 全局配置（所有版本共享）
# =========================================================
# Mod Properties
mod_version=1.0.0
maven_group=com.example
# fabric-loom 插件版本（铁律：1.17.11 老插件，新版不生成 refmap）
loom_version=1.17.11

# MixinExtras（@WrapOperation 等）：编译期 API + include 随包分发
mixinextras_version=0.5.4

# 编译目标 Java 版本（build.gradle 读取）：1.20.5+ 要求 Java 21，老版本用 17
# IF >= fabric-1.20.5
#targetJavaVersion=21
# ELSE
targetJavaVersion=17
# END IF

# =========================================================
# 版本块（ModMultiVersion 工具按版本目录解注释，其余保持注释）
# 每个版本块包含：minecraft_version / yarn_mappings / loader_version
#   / fabric_api_version / carpet_version
# 版本号查证来源（2026-08-11/08-12）：
#   carpet/fabric-api = Modrinth API 全量版本列表（release 最新）
#   yarn = meta.fabricmc.net/v2/versions/yarn/{mc}
#   loader = meta.fabricmc.net/v2/versions/loader/{mc}
# =========================================================

